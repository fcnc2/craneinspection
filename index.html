<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspection Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
    }

    .header-sub {
      margin-top: 4px;
      color: #d1d5db;
      font-size: 14px;
    }

    .wrap {
      min-height: calc(100vh - 82px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 8px 26px rgba(17,24,39,.10);
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .message {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 22px;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width .18s linear, background .18s linear;
      background: #dc2626;
    }

    .progress-text {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #4b5563;
    }

    .status {
      margin-top: 18px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #f3f4f6;
      color: #374151;
      font-size: 13px;
    }

    .open-btn {
      margin-top: 18px;
      display: inline-block;
      border: none;
      background: #111827;
      color: #fff;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .open-btn:hover {
      background: #374151;
    }

    @media (max-width: 600px) {
      .header {
        padding: 15px;
      }

      .header-title {
        font-size: 20px;
      }

      .card {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-title">🚧 Inspection Dashboard</div>
    <div class="header-sub">Crane / Handlift / Stacker</div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="icon">🏗️</div>

      <div class="title">กำลังเปิดระบบ Inspection</div>
      <div class="message">
        กำลังเชื่อมต่อไปยัง Dashboard กรุณารอสักครู่
      </div>

      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div id="progressText" class="progress-text">0%</div>

      <div id="statusText" class="status">
        กำลังเตรียม Dashboard...
      </div>

      <a class="open-btn" href="https://script.google.com/macros/s/AKfycbxfWSJiuOTJXd6CGFzznj3eaZoLjquhemMoDkysl6e1-lZpsAnr84TiA36aOqw7tyZw/exec">
        เปิด Dashboard
      </a>
    </div>
  </div>

  <script>
    const TARGET_URL = "https://script.google.com/macros/s/AKfycbxfWSJiuOTJXd6CGFzznj3eaZoLjquhemMoDkysl6e1-lZpsAnr84TiA36aOqw7tyZw/exec";

    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const statusText = document.getElementById("statusText");

    let progress = 0;

    function getProgressColor(p) {
      if (p > 95) return "#16a34a";
      if (p >= 80) return "#f59e0b";
      return "#dc2626";
    }

    const timer = setInterval(function() {
      progress += 4;

      if (progress > 100) {
        progress = 100;
      }

      progressFill.style.width = progress + "%";
      progressFill.style.background = getProgressColor(progress);
      progressText.textContent = progress + "%";

      if (progress < 80) {
        statusText.textContent = "กำลังเตรียม Dashboard...";
      } else if (progress <= 95) {
        statusText.textContent = "กำลังเชื่อมต่อระบบ...";
      } else {
        statusText.textContent = "พร้อมใช้งาน";
      }

      if (progress >= 100) {
        clearInterval(timer);

        setTimeout(function() {
          window.location.replace(TARGET_URL);
        }, 250);
      }

    }, 45);
  </script>

</body>
</html>
